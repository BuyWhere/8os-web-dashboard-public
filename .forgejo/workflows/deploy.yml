name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: host
    steps:
      - name: Checkout
        run: |
          rm -rf "$RUNNER_TEMP/src"
          git clone --depth 1 --branch main "https://token:${{ github.token }}@forgejo-production-4fb0.up.railway.app/${{ github.repository }}.git" "$RUNNER_TEMP/src"
      - name: Deploy frontend
        run: cd "$RUNNER_TEMP/src" && railway up --service frontend --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy web-dashboard
        run: cd "$RUNNER_TEMP/src/backend" && railway up --service web-dashboard --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
